<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>On-Safe 정책 문서</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --primary: #1a1a2e;
      --accent: #2563eb;
      --accent-light: #dbeafe;
      --text: #1e1e2e;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 8px 24px rgba(0,0,0,0.06);
      --radius: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      padding: 2rem 2rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .card-header h1 {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1.2;
    }

    .card-header p {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 300;
    }

    .doc-list {
      list-style: none;
      padding: 1rem 1.25rem;
    }

    .doc-list li {
      animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .doc-list li:nth-child(1) { animation-delay: 0.07s; }
    .doc-list li:nth-child(2) { animation-delay: 0.14s; }
    .doc-list li:nth-child(3) { animation-delay: 0.21s; }
    .doc-list li:nth-child(4) { animation-delay: 0.28s; }

    .doc-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 0.85rem;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      transition: background 0.18s, transform 0.18s;
    }

    .doc-link:hover {
      background: var(--accent-light);
      transform: translateX(4px);
    }

    .doc-link:hover .doc-icon {
      background: var(--accent);
      color: #fff;
    }

    .doc-link:hover .doc-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .doc-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #f0f4ff;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.18s, color 0.18s;
    }

    .doc-icon svg { width: 20px; height: 20px; }

    .doc-info { flex: 1; }

    .doc-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.3;
    }

    .doc-desc {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 300;
      margin-top: 2px;
    }

    .doc-arrow {
      color: var(--accent);
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.18s, transform 0.18s;
      flex-shrink: 0;
    }

    .doc-arrow svg { width: 16px; height: 16px; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 1.25rem;
    }

    .card-footer {
      padding: 1rem 2rem;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>On-Safe 정책 문서</h1>
    <p>서비스 이용 전 아래 문서를 확인해 주세요.</p>
  </div>

  <ul class="doc-list">
    <li>
      <a class="doc-link" href="terms_of_service.html">

            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <div class="doc-info">
          <div class="doc-title">이용약관</div>
          <div class="doc-desc">서비스 이용에 관한 기본 약관</div>
        </div>
        <div class="doc-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </a>
    </li>

    <div class="divider"></div>

    <li>
      <a class="doc-link" href="privacy_consent.html">
        <div class="doc-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="doc-info">
          <div class="doc-title">개인정보 처리방침</div>
          <div class="doc-desc">개인정보 수집·이용·보관 방침</div>
        </div>
        <div class="doc-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </a>
    </li>

    <div class="divider"></div>

    <li>
      <a class="doc-link" href="sensitive_data_consent.html">
        <div class="doc-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div class="doc-info">
          <div class="doc-title">민감정보 처리 동의</div>
          <div class="doc-desc">민감한 개인정보 처리에 관한 동의</div>
        </div>
        <div class="doc-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </a>
    </li>

    <div class="divider"></div>

    <li>
      <a class="doc-link" href="marketing_consent.html">
        <div class="doc-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        <div class="doc-info">
          <div class="doc-title">마케팅 정보 수신 동의</div>
          <div class="doc-desc">광고·홍보 정보 수신에 관한 동의</div>
        </div>
        <div class="doc-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </a>
    </li>
  </ul>

  <div class="card-footer">
    © 2026 On-Safe. All rights reserved.
  </div>
</div>

</body>
</html>
